[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comrad-bot"
version = "0.1.0"
description = "Bot modular para Discord com música, sons personalizados e IA."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "discord.py>=2.6,<3",
  "openai>=1.99,<3",
  "pydantic-settings>=2.10,<3",
  "PyNaCl>=1.5,<2",
  "SQLAlchemy[asyncio]>=2.0,<2.2",
  "yt-dlp>=2025.7.21",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
comradbot = "comradbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true
