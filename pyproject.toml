[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comrad-bot"
version = "1.0.0"
description = "A modular Discord bot for music, custom sounds, and generative AI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "discord.py[voice]>=2.7.1,<3",
  "groq>=1.5,<2",
  "openai>=1.99,<3",
  "pydantic-settings>=2.10,<3",
  "SQLAlchemy[asyncio]>=2.0,<2.2",
  "yt-dlp>=2025.7.21",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
comradbot = "comradbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp --cov=comradbot --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["comradbot"]

[tool.coverage.report]
fail_under = 70
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
exclude = ["AGENTS.md"]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true
