name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: >-
          python -m pytest
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-python-3.12
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: comradbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test runtime dependencies
        run: |
          docker run --rm --entrypoint python comradbot:ci --version
          docker run --rm --entrypoint ffmpeg comradbot:ci -version
          docker run --rm --entrypoint ffprobe comradbot:ci -version
          docker run --rm --entrypoint deno comradbot:ci --version
          docker run --rm --entrypoint python comradbot:ci -c "import comradbot"
