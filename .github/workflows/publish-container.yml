name: Publish container

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish (for example, v1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-container-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          version="$(python scripts/validate_release.py '${{ github.event.release.tag_name || inputs.tag }}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Docker deployment bundle
        shell: bash
        run: |
          bundle_directory="comradbot-${{ steps.release.outputs.version }}-docker"
          mkdir "$bundle_directory"
          cp .env.example compose.production.yaml "$bundle_directory/"
          zip -r "${bundle_directory}.zip" "$bundle_directory"
          sha256sum "${bundle_directory}.zip" > "${bundle_directory}.zip.sha256"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKER_USERNAME }}/comradbot
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=ComradBot
            org.opencontainers.image.description=Discord bot for music, custom sounds, and generative AI
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload '${{ github.event.release.tag_name || inputs.tag }}' \
            "comradbot-${{ steps.release.outputs.version }}-docker.zip" \
            "comradbot-${{ steps.release.outputs.version }}-docker.zip.sha256" \
            --clobber
